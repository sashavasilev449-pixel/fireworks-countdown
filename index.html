<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050711">
  <title>Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <main class="timer" aria-live="polite">
    <div class="time" id="countdown">
      <span><b id="days">00</b><small>ДНЕЙ</small></span>
      <i>:</i>
      <span><b id="hours">00</b><small>ЧАСОВ</small></span>
      <i>:</i>
      <span><b id="minutes">00</b><small>МИНУТ</small></span>
      <i>:</i>
      <span><b id="seconds">00</b><small>СЕКУНД</small></span>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
